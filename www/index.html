<div id="cajaErrorGlobal" style="display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#c0392b;color:#fff;padding:12px;font-size:13px;white-space:pre-wrap;word-break:break-word;"></div>
<script>
  // Atrapa-errores global: muestra en pantalla CUALQUIER error, incluso si
  // truena antes de que corra nuestro propio codigo (por ejemplo, al
  // conectar con Firebase). Sin esto, en el telefono los errores se pierden
  // porque no hay consola visible como en una computadora.
  function mostrarErrorGlobal(texto) {
    var caja = document.getElementById("cajaErrorGlobal");
    caja.style.display = "block";
    caja.textContent = "Error de la app: " + texto;
  }
  window.addEventListener("error", function (ev) {
    mostrarErrorGlobal((ev.message || "error") + " (" + (ev.filename || "") + ":" + (ev.lineno || "") + ")");
  });
