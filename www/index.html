<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Duelo FM</title>
<link rel="stylesheet" href="style.css" />
<link rel="manifest" href="manifest.json" />
</head>
<body>
<div class="contenedor">
  <div class="titulo-app">⚔ DUELO FM</div>

  <div class="panel" id="panelIngresar">
    <h3>Entrar</h3>
    <input type="email" id="correoIngresar" placeholder="Correo" autocomplete="username" />
    <input type="password" id="claveIngresar" placeholder="Contrasena" autocomplete="current-password" />
    <button id="btnIngresar">Entrar</button>
    <div class="mensaje-error" id="errorIngresar"></div>
  </div>

  <div class="panel" id="panelRegistrar">
    <h3>Crear cuenta</h3>
    <input type="text" id="nombreRegistrar" placeholder="Tu nombre" />
    <input type="email" id="correoRegistrar" placeholder="Correo (gmail, hotmail, etc.)" autocomplete="username" />
    <input type="password" id="claveRegistrar" placeholder="Contrasena" autocomplete="new-password" />
    <button class="secundario" id="btnRegistrar">Crear cuenta</button>
    <div class="mensaje-error" id="errorRegistrar"></div>
  </div>

  <p style="text-align:center;color:var(--texto-tenue);font-size:12px;">version 0.1 - fase 1 (pantalla plana)</p>
</div>

<script type="module" src="firebase-config.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
